---
# Example gateway VM configuration - NOT real deployment data.
#
# Addresses use the IANA documentation ranges reserved by RFC 5737
# (203.0.113.0/24 TEST-NET-3, 198.51.100.0/24 TEST-NET-2) so they can never collide
# with real routable or internal addressing.
#
# Layout: <hypervisor hostname> -> RegionName, static_routes, then one entry per gateway VM
# mapping interface name to CIDR. The file name must match the first two dash-separated
# fields of the VM names inside it, because roles/read_vms_yml_file derives it that way:
#   sanjose-hypervisor-1-vm-1 -> sanjose-hypervisor.yml

sanjose-hypervisor-1:
  RegionName: "us_west_2"
  static_routes:
    - destination_prefix: 0.0.0.0/0
      next_hop: 203.0.113.1
      description: dia_default_route
  vms:
    gw-1-vm:
      hostname: sanjose-hypervisor-1-vm-1
      GigabitEthernet3_0_0: 203.0.113.11/27
      VirtualFunctionEthernet6_0_0: 198.51.100.11/24
      VirtualFunctionEthernet7_0_0: 198.51.100.111/24
    gw-2-vm:
      hostname: sanjose-hypervisor-1-vm-2
      GigabitEthernet3_0_0: 203.0.113.12/27
      VirtualFunctionEthernet6_0_0: 198.51.100.12/24
      VirtualFunctionEthernet7_0_0: 198.51.100.112/24
    gw-3-vm:
      hostname: sanjose-hypervisor-1-vm-3
      GigabitEthernet3_0_0: 203.0.113.13/27
      VirtualFunctionEthernet6_0_0: 198.51.100.13/24
      VirtualFunctionEthernet7_0_0: 198.51.100.113/24
    gw-4-vm:
