---
# Example gateway VM configuration - NOT real deployment data.
#
# Addresses use the IANA documentation ranges reserved by RFC 5737
# (203.0.113.0/24 TEST-NET-3, 198.51.100.0/24 TEST-NET-2) so they can never collide
# with real routable or internal addressing.
#
# Layout: <hypervisor hostname> -> RegionName, static_routes, then one entry per gateway VM
# mapping interface name to CIDR. The file name must match the first two dash-separated
# fields of the VM names inside it, because roles/read_vms_yml_file derives it that way:
#   virginia-hypervisor-1-vm-1 -> virginia-hypervisor.yml

virginia-hypervisor-1:
  RegionName: "us_east_1"
  static_routes:
    - destination_prefix: 0.0.0.0/0
      next_hop: 203.0.113.65
      description: dia_default_route
  vms:
    gw-1-vm:
      hostname: virginia-hypervisor-1-vm-1
      GigabitEthernet3_0_0: 203.0.113.75/27
      VirtualFunctionEthernet6_0_0: 198.51.100.31/24
      VirtualFunctionEthernet7_0_0: 198.51.100.131/24
    gw-2-vm:
      hostname: virginia-hypervisor-1-vm-2
      GigabitEthernet3_0_0: 203.0.113.76/27
      VirtualFunctionEthernet6_0_0: 198.51.100.32/24
      VirtualFunctionEthernet7_0_0: 198.51.100.132/24
    gw-3-vm:
      hostname: virginia-hypervisor-1-vm-3
