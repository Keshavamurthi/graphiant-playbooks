---
- name: Download GNOS image
  hosts: gateway_hypervisors
  become: true
  gather_facts: true

  vars_files:
    - vars/gateway_vm_vars.yml

  pre_tasks:
    - name: Get bearer token
      when: bearer_token is not defined
      ansible.builtin.include_role:
        name: get_bearer_token

    - name: Get Software Version Information
      ansible.builtin.include_role:
        name: get_software_version_info

    - name: Download GNOS qcow2 image
      ansible.builtin.include_role:
        name: download_gnos_qcow2
