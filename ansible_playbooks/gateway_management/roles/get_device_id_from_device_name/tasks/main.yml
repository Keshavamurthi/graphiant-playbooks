---
- name: Verify api_base_url is available
  when: api_base_url is not defined
  ansible.builtin.fail:
    msg: "api_base_url not found"

- name: Verify bearer_token is available
  when: bearer_token is not defined
  ansible.builtin.fail:
    msg: "bearer_token not found"

- name: Get edge summary
  graphiant.naas.graphiant_api:
    host: "{{ api_base_url }}"
    access_token: "{{ bearer_token }}"
    method: get_edges_summary
    kwargs:
      hostname: "{{ device_hostname }}"
  register: edge_summary_response
  retries: 10
  delay: 30
  # fail_json omits response_data; only check payload after a succeeded call.
  until: >
    edge_summary_response is succeeded
    and edge_summary_response.get('response_data') is not none
    and edge_summary_response['response_data'].get('device_id') is not none

- name: Get device ID from device name
  ansible.builtin.set_fact:
    device_id: "{{ edge_summary_response.response_data.device_id }}"
  delegate_to: localhost

- name: Display device ID and device hostname details
  ansible.builtin.debug:
    msg: "device_id {{ device_id }} and device_hostname {{ device_hostname }}"
  delegate_to: localhost
